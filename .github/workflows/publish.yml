name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Запуск при создании тега v1.0.0, v1.1.0 и т.д.

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Publish Application
      run: |
        # Публикуем проект (замени UFZapret на имя твоего .csproj файла)
        dotnet publish UFZapret.Forms/UFZapret.Forms.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=false `
          -o ./publish/Release
        
        # Создаем папку .service если её нет
        mkdir -p ./publish/Release/.service
        
        # Создание version.txt
        $tag = "${{ github.ref_name }}"
        $version = $tag.Substring(1)  # Убираем "v"
        echo $version | Out-File -FilePath "./publish/Release/.service/version.txt" -Encoding UTF8
        
        # Выводим список файлов для отладки
        echo "=== Содержимое папки publish ==="
        dir ./publish/Release -Recurse
        
        # Создание ZIP архива (только содержимое Release папки)
        Compress-Archive -Path ./publish/Release/* -DestinationPath ./UFZapret-$version.zip -Force
    
    - name: Upload Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./UFZapret-*.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}