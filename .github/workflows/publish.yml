name: Build and Release

on:
  push:
    tags:
      - 'v*'

# Явно указываем права
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Build Solution
      run: |
        dotnet build "UserFreindlyZapret-FlowSealOrigin.sln" -c Release
    
    - name: Publish Application
      run: |
        if (Test-Path "./publish") {
          Remove-Item "./publish" -Recurse -Force
        }
        
        dotnet publish "UFZapret.Forms/UFZapret.Forms.csproj" `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=false `
          -o ./publish
        
        New-Item -ItemType Directory -Force -Path "./publish/.service"
        $tag = "${{ github.ref_name }}"
        $version = $tag.Substring(1)

        echo $version | Out-File -FilePath "./publish/version.txt" -Encoding UTF8

        echo $version | Out-File -FilePath "./publish/.service/version.txt" -Encoding UTF8
    
    - name: Create ZIP Archive
      id: create_zip
      run: |
        $tag = "${{ github.ref_name }}"
        $version = $tag.Substring(1)
        $zipName = "UFZapret-v$version.zip"
        Compress-Archive -Path "./publish/*" -DestinationPath "./$zipName" -Force
        echo "zip_name=$zipName" >> $env:GITHUB_OUTPUT
        echo "version=$version" >> $env:GITHUB_OUTPUT
    
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: Release v${{ steps.create_zip.outputs.version }}
        body: |
          Сборка приложения UFZapret версии ${{ steps.create_zip.outputs.version }}
          
          **Инструкция:**
          1. Скачайте архив UFZapret-v${{ steps.create_zip.outputs.version }}.zip
          2. Распакуйте в любую папку
          3. Запустите UFZapret.Forms.exe
        draft: false
        prerelease: false
        files: |
          ./${{ steps.create_zip.outputs.zip_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}